# CR IA v0.1.1 — Nginx do frontend (Docker)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads: acompanha MAX_UPLOAD_MB da API (padrão 25 MB + margem)
  client_max_body_size 30M;

  # Cabeçalhos de segurança (defesa em profundidade; a API também envia os dela)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Upload da Central de Atualizações: ZIP grande (só admin, validado na API).
  # Prefixo mais longo vence sobre /api/ (limite maior só aqui).
  location /api/admin/updates/upload {
    add_header X-Proxied-By "cr-ia-nginx" always;
    client_max_body_size 300M;
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # API: proxy para o backend (mesma origem, sem CORS em produção).
  # O add_header abaixo substitui os do nível server neste location (a API
  # já envia os próprios cabeçalhos de segurança — evita duplicados).
  location /api/ {
    add_header X-Proxied-By "cr-ia-nginx" always;
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    # SSE streaming (chat em tempo real)
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # SPA: qualquer rota cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache agressivo só nos assets com hash do Vite
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
